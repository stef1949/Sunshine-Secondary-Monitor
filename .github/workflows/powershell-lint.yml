name: PowerShell Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Analyze PowerShell
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Parse scripts
        shell: pwsh
        run: |
          $scriptFiles = Get-ChildItem -Path scripts, examples -Filter *.ps1 -Recurse

          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($scriptFile.FullName, [ref] $tokens, [ref] $parseErrors) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              throw "PowerShell parser errors found in $($scriptFile.FullName)."
            }
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @()
          $results += Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings PSScriptAnalyzerSettings.psd1 -Severity Warning,Error
          $results += Invoke-ScriptAnalyzer -Path examples -Recurse -Settings PSScriptAnalyzerSettings.psd1 -Severity Warning,Error

          if ($results.Count -gt 0) {
            $results |
              Select-Object RuleName, Severity, ScriptPath, ScriptName, Line, Column, Message |
              Sort-Object ScriptPath, Line, Column |
              Format-Table -AutoSize |
              Out-String -Width 300 |
              Write-Host

            throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
